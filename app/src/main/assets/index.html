<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07865b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>My Money Tracker</title><style>
:root{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#172b3a;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}.app{max-width:650px;margin:auto;min-height:100dvh;background:#fff;position:relative;padding-bottom:100px}header{background:#07865b;color:white;padding:20px 18px;display:flex;align-items:center;gap:14px}header.blue{background:#2876d5}header button{background:none;color:inherit;border:0;font-size:25px;cursor:pointer}header h1{font-size:20px;margin:0;flex:1}.page{padding:20px 16px}.hero{text-align:center;padding:50px 12px 32px}.hero h1{font-size:28px}.hero p{color:#687a88}.choice{width:100%;border:0;border-radius:16px;padding:26px 18px;text-align:left;font-size:20px;font-weight:750;color:white;margin:12px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.green{background:linear-gradient(120deg,#16b981,#008659)}.bluebg{background:linear-gradient(120deg,#59a4ff,#246bd4)}.muted{color:#72808b}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.stat{background:#f2f7f5;padding:12px 7px;border-radius:12px;text-align:center}.stat small{display:block;font-size:11px;color:#667}.stat strong{display:block;font-size:15px;margin-top:5px}.tabs{display:flex;background:#f1f4f6;border-radius:12px;padding:4px;gap:3px;margin-bottom:16px}.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:11px 4px;font-weight:650;color:#667}.tabs button.active{background:white;color:#07865b;box-shadow:0 1px 5px #0001}.search{width:100%;border:1px solid #d8e1e5;border-radius:11px;padding:13px;font-size:15px;margin-bottom:14px}.entry{border:1px solid #e1e7e9;border-radius:13px;margin-bottom:11px;padding:14px}.entry.done{background:#eaf9f1;border-color:#b7ebcd}.entryTop{display:flex;justify-content:space-between;gap:12px}.entry h3{margin:0 0 3px;font-size:17px}.entry small{color:#72808b}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.amounts small{display:block;font-size:11px;color:#667}.amounts b{font-size:15px}.red{color:#d93939}.ok{color:#07865b}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;padding:10px 5px;background:#f2f6f8;border:0;border-radius:8px;font-weight:650;color:#26455b}.actions button:first-child{background:#e4f7ed;color:#087e56}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:650px;width:100%;padding:13px 16px calc(13px + env(safe-area-inset-bottom));background:white;border-top:1px solid #e5e9eb}.primary{width:100%;padding:15px;border:0;border-radius:11px;background:#07865b;color:white;font-weight:750;font-size:16px;cursor:pointer}.primary.bluebg{background:#2876d5}label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}input,textarea{font:inherit}form input,form textarea{width:100%;padding:13px;border:1px solid #d5e0e5;border-radius:10px;background:#fff}form textarea{min-height:75px}.empty{text-align:center;color:#82919a;padding:65px 20px}.more{display:flex;gap:10px;margin:25px 0;flex-wrap:wrap}.more button{border:1px solid #d7e1e6;border-radius:9px;padding:10px;background:white;color:#345}.link{color:#07865b;background:none;border:0;font-weight:650}.danger{color:#b72e35!important}.notice{background:#fff7e4;border-radius:10px;padding:12px;font-size:13px;color:#7e6227}.badge{font-size:12px;padding:5px 8px;border-radius:20px;background:#e8f5ed;color:#07865b}.hidden{display:none!important}

.person-card{border:1px solid #e1e7e9;border-radius:14px;margin-bottom:12px;padding:14px;background:#fff}
.person-card.done{background:#eaf9f1;border-color:#b7ebcd}
.person-card h3{margin:0 0 4px;font-size:18px}
.person-card small,.history-item small{color:#72808b}
.person-card .actions{flex-wrap:wrap}
.person-card .actions button{min-width:110px}
.history-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e8eef0;padding:13px 0}
.history-item:last-child{border-bottom:0}
.history-item b{white-space:nowrap}
.history-item .actions{margin-top:7px}
.history-item .actions button{padding:7px 10px;min-width:0;flex:0}
.section-label{font-size:13px;color:#687a88;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.detail-total{padding:13px;border-radius:12px;background:#f2f7f5;margin:14px 0}
</style></head><body><main id="app" class="app"></main><script>
const KEY='private-money-tracker-v1';let records=[];try{const r=JSON.parse(localStorage.getItem(KEY)||'[]');records=Array.isArray(r)?r:[]}catch{};let section='gave',screen='home',tab='active',search='',editId=null,repayId=null,personKey=null;
const $=id=>document.getElementById(id),fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),balance=r=>Math.max(0,Number(r.amount)-r.payments.reduce((a,p)=>a+Number(p.amount),0)),paid=r=>r.payments.reduce((a,p)=>a+Number(p.amount),0),date=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

function personGroupKey(name){return String(name||'').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function personRecords(key){return records.filter(r=>r.section===section&&personGroupKey(r.name)===key).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)))}
function groupsForSection(){const map=new Map();for(const r of records.filter(r=>r.section===section)){const key=personGroupKey(r.name);if(!map.has(key))map.set(key,{key,name:r.name,items:[]});map.get(key).items.push(r)}return [...map.values()].map(g=>({...g,total:g.items.reduce((a,r)=>a+Number(r.amount),0),returned:g.items.reduce((a,r)=>a+paid(r),0),latest:g.items.reduce((a,r)=>r.date>a?r.date:a,'')}))}
function groupPending(g){return Math.max(0,Math.round((g.total-g.returned)*100)/100)}
function openPerson(key){personKey=key;nav('person')}
function openAddForPerson(){editId=null;nav('form')}
function closeToPerson(){nav('person')}
function historyFor(items){const history=[];const byId=new Map();for(const r of items){history.push({type:'given',date:r.date,id:r.id,amount:Number(r.amount),notes:r.notes||'',record:r});for(const p of r.payments){const id=p.id||('legacy-'+r.id+'-'+p.date+'-'+p.amount);if(byId.has(id)){byId.get(id).amount+=Number(p.amount)}else{const h={type:'repay',date:p.date,id,amount:Number(p.amount),notes:p.notes||''};byId.set(id,h);history.push(h)}}}return history.sort((a,b)=>b.date.localeCompare(a.date)||(a.type==='repay'?-1:1))}
function deletePersonTransaction(id){removeRecord(id)}

function persist(){localStorage.setItem(KEY,JSON.stringify(records))}function nav(s){screen=s;render()}function head(title){return `<header class="${section==='took'?'blue':''}"><button aria-label="Back" onclick="nav('${screen==='list'?'home':(screen==='person'?'list':(personKey?'person':'list'))}')">‹</button><h1>${title}</h1></header>`}function title(){return section==='gave'?'Money I Gave':'Money I Took'}
function render(){const app=$('app');if(screen==='home'){app.innerHTML=`<div class="page"><div class="hero"><h1>My Money Tracker</h1><p>Private • Offline • Just for you</p></div><button class="choice green" onclick="openSection('gave')">↗ &nbsp; Money I Gave <span>›</span></button><button class="choice bluebg" onclick="openSection('took')">↙ &nbsp; Money I Took <span>›</span></button><div class="more"><button onclick="exportData()">⬇ Export backup</button><button onclick="window.AndroidBackup?window.chooseBackup():$('importFile').click()">⬆ Restore backup</button><input class="hidden" id="importFile" type="file" accept="application/json,.json" onchange="importData(event)"></div><div class="notice">Records stay on this device. Back up regularly: clearing app data or uninstalling can erase them.</div></div>`;return}
if(screen==='list'){const groups=groupsForSection(),shown=groups.filter(g=>(tab==='active'?groupPending(g)>0:groupPending(g)===0)&&g.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.latest.localeCompare(a.latest));const total=groups.reduce((a,g)=>a+g.total,0),returned=groups.reduce((a,g)=>a+g.returned,0);app.innerHTML=head(title())+`<div class="page"><div class="summary"><div class="stat"><small>${section==='gave'?'Given':'Taken'}</small><strong>${fmt(total)}</strong></div><div class="stat"><small>Returned</small><strong class="ok">${fmt(returned)}</strong></div><div class="stat"><small>Pending</small><strong class="red">${fmt(total-returned)}</strong></div></div><div class="tabs"><button class="${tab==='active'?'active':''}" onclick="setTab('active')">Active (${groups.filter(g=>groupPending(g)>0).length})</button><button class="${tab==='returned'?'active':''}" onclick="setTab('returned')">Returned (${groups.filter(g=>groupPending(g)===0).length})</button></div><input class="search" placeholder="Search by name" value="${esc(search)}" oninput="setSearch(this.value)"><div id="entries">${shown.length?shown.map(g=>`<div class="person-card ${groupPending(g)===0?'done':''}"><div class="entryTop"><div><h3>${esc(g.name)}</h3><small>${g.items.length} transaction${g.items.length===1?'':'s'}</small></div>${groupPending(g)===0?'<span class="badge">✓ Returned</span>':''}</div><div class="amounts"><div><small>${section==='gave'?'Given':'Taken'}</small><b>${fmt(g.total)}</b></div><div><small>Returned</small><b class="ok">${fmt(g.returned)}</b></div><div><small>Pending</small><b class="${groupPending(g)?'red':'ok'}">${fmt(groupPending(g))}</b></div></div><div class="actions"><button onclick="openPerson(decodeURIComponent('${encodeURIComponent(g.key)}'))">View History ›</button></div></div>`).join(''):'<div class="empty">No records here yet.</div>'}</div></div><div class="bottom"><button class="primary ${section==='took'?'bluebg':''}" onclick="openAdd()">＋ Add New Record</button></div>`;return}
if(screen==='person'){const items=personRecords(personKey);if(!items.length){nav('list');return}const name=items[items.length-1].name,total=items.reduce((a,r)=>a+Number(r.amount),0),returned=items.reduce((a,r)=>a+paid(r),0),pending=Math.max(0,Math.round((total-returned)*100)/100),history=historyFor(items);app.innerHTML=head(esc(name))+`<div class="page"><div class="summary"><div class="stat"><small>${section==='gave'?'Given':'Taken'}</small><strong>${fmt(total)}</strong></div><div class="stat"><small>Returned</small><strong class="ok">${fmt(returned)}</strong></div><div class="stat"><small>Pending</small><strong class="${pending?'red':'ok'}">${fmt(pending)}</strong></div></div>${pending===0?'<p class="badge">✓ Fully returned</p>':''}<div class="actions"><button onclick="openAddForPerson()">＋ Add Money</button>${pending>0?'<button onclick="openGroupRepay()">＋ Repayment</button>':''}</div><h3 class="section-label">Transaction history</h3>${history.map(h=>`<div class="history-item"><div><strong>${h.type==='given'?(section==='gave'?'Money given':'Money taken'):'Repayment'}</strong><br><small>${date(h.date)}${h.notes?' · '+esc(h.notes):''}</small>${h.type==='given'?`<div class="actions"><button onclick="openEdit('${h.id}')">Edit</button><button class="danger" onclick="deletePersonTransaction('${h.id}')">Delete</button></div>`:''}</div><b class="${h.type==='repay'?'ok':''}">${h.type==='repay'?'−':'+'}${fmt(h.amount)}</b></div>`).join('')}</div><div class="bottom"><button class="primary ${section==='took'?'bluebg':''}" onclick="openAddForPerson()">＋ Add Money</button></div>`;return}
if(screen==='form'){let r=records.find(x=>x.id===editId);let items=personKey?personRecords(personKey):[],defaultName=!r&&items.length?items[items.length-1].name:'';app.innerHTML=head(r?'Edit Record':'Add New Record')+`<form id="recordForm" class="page" onsubmit="saveRecord(event)"><label for="name">Person Name</label><input id="name" required maxlength="100" placeholder="Enter name" value="${esc(r?.name||defaultName)}"><label for="amount">Amount ${section==='gave'?'Given':'Taken'} (₹)</label><input id="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" value="${r?.amount||''}"><label for="date">Date</label><input id="date" type="date" required value="${r?.date||today()}"><label for="notes">Notes (optional)</label><textarea id="notes" placeholder="Reason, UPI, etc.">${esc(r?.notes||'')}</textarea><div class="bottom"><button class="primary ${section==='took'?'bluebg':''}" type="submit">Save Record</button></div></form>`;return}
if(screen==='repay'){const items=personRecords(personKey);if(!items.length){nav('list');return}const total=items.reduce((a,r)=>a+Number(r.amount),0),returned=items.reduce((a,r)=>a+paid(r),0),pending=Math.max(0,Math.round((total-returned)*100)/100);app.innerHTML=head('Record Repayment')+`<div class="page"><h2>${esc(items[items.length-1].name)}</h2><p class="muted">Total: ${fmt(total)} · Returned: ${fmt(returned)}</p><h3 class="red">Pending: ${fmt(pending)}</h3><div class="notice">Repayment is automatically applied to the oldest unpaid transaction first.</div><form onsubmit="saveRepayment(event)"><label for="repayAmount">Amount Returned (₹)</label><input id="repayAmount" type="number" min="0.01" max="${pending}" step="0.01" required inputmode="decimal"><label for="repayDate">Date</label><input id="repayDate" type="date" required value="${today()}"><label for="repayNotes">Notes (optional)</label><textarea id="repayNotes" placeholder="Cash, UPI, etc."></textarea><div class="bottom"><button class="primary ${section==='took'?'bluebg':''}" type="submit">Save Repayment</button></div></form></div>`;return}}
function openSection(s){section=s;tab='active';search='';personKey=null;nav('list')}function setTab(t){tab=t;render()}function setSearch(v){search=v;render();const inp=document.querySelector('.search');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}}function openAdd(){personKey=null;editId=null;nav('form')}function openEdit(id){editId=id;const r=records.find(x=>x.id===id);if(r)personKey=personGroupKey(r.name);nav('form')}function openGroupRepay(){nav('repay')}
function saveRecord(e){e.preventDefault();const name=$('name').value.trim(),amount=Number($('amount').value),dt=$('date').value,notes=$('notes').value.trim();if(!name||!Number.isFinite(amount)||amount<=0||!dt)return alert('Please enter valid details.');let r=records.find(x=>x.id===editId);if(r){if(amount+0.000001<paid(r))return alert('Amount cannot be less than already returned.');Object.assign(r,{name,amount,date:dt,notes})}else records.push({id:crypto.randomUUID(),section,name,amount,date:dt,notes,payments:[]});personKey=personGroupKey(name);persist();nav('person')}
function saveRepayment(e){e.preventDefault();const items=personRecords(personKey);const amount=Number($('repayAmount').value);const pending=Math.round(items.reduce((a,r)=>a+balance(r),0)*100)/100;const dt=$('repayDate').value;if(!items.length||!Number.isFinite(amount)||amount<=0||Math.round(amount*100)!==amount*100||amount>pending+0.000001||!dt)return alert('Enter a valid repayment up to the pending balance.');let remaining=Math.round(amount*100);const paymentId=crypto.randomUUID();for(const r of items){const available=Math.round(balance(r)*100);const used=Math.min(available,remaining);if(used>0){r.payments.push({id:paymentId,amount:used/100,date:dt,notes:$('repayNotes').value.trim()});remaining-=used}if(remaining===0)break}if(remaining!==0)return alert('Unable to allocate repayment. No changes saved.');persist();nav('person')}
function removeRecord(id){
  const r = records.find(x => x.id === id);
  if (!r) return;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  overlay.innerHTML = `
    <div style="background:white;border-radius:16px;padding:24px;width:100%;max-width:360px">
      <h3 style="margin-top:0">Delete record?</h3>
      <p>This will permanently delete this record and its repayment history.</p>
      <div style="display:flex;gap:12px;margin-top:20px">
        <button id="cancelDelete" style="flex:1;padding:14px;border:0;border-radius:9px">Cancel</button>
        <button id="confirmDelete" style="flex:1;padding:14px;border:0;border-radius:9px;background:#d93939;color:white">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#cancelDelete').onclick = () => overlay.remove();
  overlay.querySelector('#confirmDelete').onclick = () => {
    records = records.filter(x => x.id !== id);
    persist();
    overlay.remove();
    if(screen==='person' && personRecords(personKey).length===0){nav('list');}else{render();}
  };
}
function exportData(){if(window.AndroidBackup){AndroidBackup.exportJson(JSON.stringify({version:1,records,exportedAt:new Date().toISOString()}));return}alert('Backup is available in the Android app.')}
async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.records)||!obj.records.every(r=>r&&typeof r.id==='string'&&['gave','took'].includes(r.section)&&typeof r.name==='string'&&Number.isFinite(r.amount)&&r.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Array.isArray(r.payments)&&r.payments.every(p=>Number.isFinite(p.amount)&&p.amount>0&&typeof p.date==='string')&&paid(r)<=r.amount))throw Error('Invalid backup');if(confirm('Restore this backup? This will replace all existing records.')){records=obj.records;persist();render()}}catch(err){alert('Could not restore backup: '+err.message)}e.target.value=''}
if(window.AndroidBackup){window.restoreBackup=function(json){try{let obj=JSON.parse(json);if(!Array.isArray(obj.records))throw Error('Invalid backup');if(confirm('Restore backup? Existing records will be replaced.')){records=obj.records;persist();render()}}catch(e){alert('Invalid backup file')}};window.chooseBackup=function(){AndroidBackup.chooseBackup()};}render();
</script></body></html>
